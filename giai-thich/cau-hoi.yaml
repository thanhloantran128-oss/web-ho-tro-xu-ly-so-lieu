# Câu hỏi nghiên cứu, giả thuyết và kế hoạch phân tích (mục "Câu hỏi nghiên cứu & kế hoạch").
# Biến có sẵn trong {…}: {x} {y} {doi_tuong} {nhom}
# Phỏng theo scholar-idea / scholar-hypothesis / scholar-design của Open Scholar Skill (Zhang, 2026), rút gọn cho THPT.

doi_tuong_mac_dinh: "học sinh tham gia khảo sát"

kieu_bien:
  phan_loai: "Phân loại (nhóm)"
  dinh_luong: "Số đo"
  likert: "Thang Likert tự xây dựng"
  thang_chuan: "Thang đo chuẩn"
  nhieu_lua_chon: "Câu nhiều lựa chọn"

dang:
  mo_ta:
    ten: "Mô tả thực trạng / tỷ lệ"
    vi_du: "Mức độ căng thẳng của học sinh như thế nào? Học sinh dùng mạng xã hội nào nhiều nhất?"
    cau_hoi_so: "Thực trạng {x} của {doi_tuong} như thế nào?"
    cau_hoi_nhom: "Tỷ lệ {doi_tuong} theo từng lựa chọn của “{x}” là bao nhiêu?"
  so_sanh:
    ten: "So sánh giữa các nhóm"
    vi_du: "Có khác biệt về mức căng thẳng giữa học sinh nam và nữ không?"
    cau_hoi_so: "Có sự khác biệt về {y} giữa các nhóm {x}{nhom} không?"
    cau_hoi_nhom: "Tỷ lệ các lựa chọn của “{y}” có khác nhau giữa các nhóm {x}{nhom} không?"
  lien_he:
    ten: "Mối liên hệ giữa hai yếu tố"
    vi_du: "Thời gian dùng mạng xã hội có liên quan đến giờ ngủ không?"
    cau_hoi_so: "Có mối liên hệ giữa {x} và {y} ở {doi_tuong} không?"
    cau_hoi_nhom: "Có mối liên hệ giữa {x} và {y} ở {doi_tuong} không?"
  truoc_sau:
    ten: "Thay đổi trước – sau (cùng người đo hai lần)"
    vi_du: "Sau buổi tập huấn, kỹ năng quản lý thời gian có thay đổi không?"
    cau_hoi_so: "Có sự thay đổi giữa {x} và {y} trên cùng những người tham gia không?"

gia_thuyet:
  khong_can: "Câu hỏi mô tả không cần giả thuyết thống kê: bạn báo cáo trung bình, độ lệch chuẩn hoặc tỷ lệ."
  so_sanh_tb:
    h0: "Không có sự khác biệt về {y} trung bình giữa các nhóm {x}."
    h1: "Có sự khác biệt về {y} trung bình giữa các nhóm {x}."
  doc_lap:
    h0: "{x} và {y} không có mối liên hệ (độc lập với nhau)."
    h1: "{x} và {y} có mối liên hệ."
  tuong_quan:
    h0: "Không có tương quan giữa {x} và {y}."
    h1: "Có tương quan giữa {x} và {y}."
  truoc_sau:
    h0: "Không có khác biệt giữa {x} và {y} (trung bình hiệu số bằng 0)."
    h1: "Có khác biệt giữa {x} và {y}."
  ghi_chu: "Giả thuyết hai phía, mức ý nghĩa α = ,05. Kết luận dùng “bác bỏ H0” hoặc “chưa đủ bằng chứng để bác bỏ H0”, không dùng “chấp nhận H0” hay “chứng minh”."

phep:
  tan-suat: "Tần suất (bảng tần số và tỷ lệ %)"
  mo-ta: "Thống kê mô tả (M, SD, min, max)"
  trung-binh: "Trung bình – độ lệch chuẩn, diễn giải theo mức Likert"
  thang-do: "Chấm điểm thang đo, Cronbach's α và phân bố theo mức"
  nhieu-lua-chon: "Câu nhiều lựa chọn (tỷ lệ chọn từng phương án)"
  t-test-doc-lap: "Independent t-test (2 nhóm); kèm Mann-Whitney U"
  anova: "One-way ANOVA (từ 3 nhóm); kèm Tukey/Games-Howell và Kruskal-Wallis"
  so-sanh-nhom: "Independent t-test nếu có 2 nhóm, One-way ANOVA nếu từ 3 nhóm"
  bang-cheo: "Bảng chéo – Chi-square; kèm Cramér's V"
  nhieu-lua-chon-nhom: "Câu nhiều lựa chọn, so sánh tỷ lệ theo nhóm"
  tuong-quan: "Tương quan Pearson (Spearman nếu biến thứ bậc hoặc phân phối lệch)"
  t-test-cap: "Paired t-test; kèm Wilcoxon"

loi:
  thieu_bien: "Hãy chọn đủ biến cho câu hỏi này."
  trung_bien: "Hai vị trí đang là cùng một biến; hãy chọn hai biến khác nhau."
  so_sanh_nhom: "Biến dùng để chia nhóm (“{x}”) phải là biến **phân loại** (giới tính, khối lớp…). Nếu “{x}” là số đo, hãy dùng dạng **Mối liên hệ**, hoặc chia “{x}” thành vài nhóm."
  so_sanh_mot_nhom: "Biến nhóm “{x}” cần ít nhất 2 nhóm."
  lien_he_mot_phan_loai: "“{nhom}” là biến phân loại còn biến kia là số đo: đây thực chất là câu hỏi **So sánh giữa các nhóm {nhom}**. Hãy đổi dạng câu hỏi."
  truoc_sau_so: "Câu hỏi trước – sau cần hai lần đo **cùng một biến số đo** (ví dụ điểm trước và sau tập huấn)."
  truoc_sau_khac_kieu: "Hai lần đo nên cùng một loại thang đo (“{x}” và “{y}” đang khác loại)."

co_mau:
  # Căn cứ: phân tích lực kiểm định (power analysis) của Cohen (1988, 1992); cỡ mẫu ước lượng tỷ lệ của Cochran (1977).
  # Giả định chung: kiểm định hai phía, α = ,05, power = ,80.
  muc:
    nho: {ten: "nhỏ", d: 0.2, f: 0.10, w: 0.10, r: 0.10}
    trung_binh: {ten: "trung bình", d: 0.5, f: 0.25, w: 0.30, r: 0.30}
    lon: {ten: "lớn", d: 0.8, f: 0.40, w: 0.50, r: 0.50}
  sai_so_mo_ta: 0.10
  gia_dinh: "Tính theo mức ảnh hưởng {muc} (Cohen, 1988), kiểm định hai phía, α = ,05, power (khả năng phát hiện) = ,80. Nếu khác biệt thật sự nhỏ hơn mức này, cần nhiều người hơn."
  mo_ta: "Khoảng {n} người để sai số của tỷ lệ khoảng ±10% (độ tin cậy 95%){hieu_chinh}."
  hieu_chinh: ", đã hiệu chỉnh cho tổng thể {N} người"
  t-test-doc-lap: "Mỗi nhóm khoảng {moi_nhom} người (tổng {n}) để phát hiện khác biệt mức {muc} (d = {d})."
  anova: "Mỗi nhóm khoảng {moi_nhom} người (tổng {n}, {k} nhóm) để phát hiện khác biệt mức {muc} (f = {f})."
  bang-cheo: "Tổng khoảng {n} người để phát hiện liên hệ mức {muc} (w = {w}); mỗi ô của bảng chéo nên có tần số kỳ vọng ≥ 5."
  tuong-quan: "Khoảng {n} người để phát hiện tương quan mức {muc} (r = {r})."
  t-test-cap: "Khoảng {n} người (đo cả hai lần) để phát hiện thay đổi mức {muc} (d = {d})."

  # Căn cứ của từng phép: công thức / cách tính và nguồn
  can_cu:
    mo_ta:
      cach_tinh: "Công thức Cochran: n₀ = z² · p(1 − p) / e², với z = 1,96 (độ tin cậy 95%), p = 0,5 (giả định an toàn nhất, cho n lớn nhất), e = 0,10 (sai số ±10%). Nếu biết quy mô tổng thể N: n = n₀ / (1 + (n₀ − 1)/N)."
      nguon: [cochran1977]
    t-test-doc-lap:
      cach_tinh: "Phân tích lực kiểm định cho Independent t-test, hai nhóm bằng nhau: tìm n nhỏ nhất sao cho power ≥ ,80, tính bằng phân phối t không trung tâm với tham số d·√(n/2)."
      nguon: [cohen1988, cohen1992, faul2007]
      doi_chieu: "Cohen (1992, Bảng 2) cho 64 người/nhóm với d = 0,5."
    anova:
      cach_tinh: "Phân tích lực kiểm định cho One-way ANOVA, các nhóm bằng nhau: phân phối F không trung tâm với λ = f² · N."
      nguon: [cohen1988, cohen1992, faul2007]
      doi_chieu: "Cohen (1992, Bảng 2) cho 52 người/nhóm với 3 nhóm, f = 0,25 (khác 1 người do làm tròn)."
    bang-cheo:
      cach_tinh: "Phân tích lực kiểm định cho Chi-square: phân phối χ² không trung tâm với λ = w² · N, bậc tự do (số hàng − 1)(số cột − 1). Điều kiện tần số kỳ vọng ≥ 5 theo Cochran (1954)."
      nguon: [cohen1988, cohen1992, faul2007, cochran1954]
      doi_chieu: "Cohen (1992, Bảng 2) cho 87 người với bảng 2 × 2, w = 0,3 (khác 1 người do làm tròn)."
    tuong-quan:
      cach_tinh: "Biến đổi Fisher z: n = [(z₁₋α/₂ + z₁₋β) / C]² + 3, với C = ½·ln[(1 + r)/(1 − r)], z₁₋α/₂ = 1,96, z₁₋β = 0,84."
      nguon: [cohen1988, cohen1992, hulley2013]
      doi_chieu: "Cohen (1992, Bảng 2) cho 85 người với r = 0,3."
    t-test-cap:
      cach_tinh: "Phân tích lực kiểm định cho Paired t-test: phân phối t không trung tâm với tham số d·√n, trong đó d tính trên hiệu số giữa hai lần đo (d_z)."
      nguon: [cohen1988, faul2007]

  giai_thich:
    - "**Vì sao phải tính cỡ mẫu?** Mẫu quá nhỏ thì dù có khác biệt thật, kiểm định vẫn dễ cho *p* > ,05 (sai lầm loại II). Cỡ mẫu được chọn sao cho khả năng phát hiện khác biệt thật (power) đạt ít nhất ,80 – mức Cohen (1988) đề xuất và được dùng phổ biến."
    - "**Mức ảnh hưởng là giả định quan trọng nhất.** Mức nhỏ / trung bình / lớn theo quy ước của Cohen (1988): *d* = 0,2 / 0,5 / 0,8; *f* = 0,10 / 0,25 / 0,40; *w* = 0,10 / 0,30 / 0,50; *r* = 0,10 / 0,30 / 0,50. Nếu có nghiên cứu trước về cùng chủ đề, nên lấy mức ảnh hưởng của nghiên cứu đó; quy ước của Cohen chỉ dùng khi chưa có thông tin."
    - "**Kiểm tra lại được:** web tính chính xác bằng các phân phối không trung tâm, giống phần mềm G∗Power (Faul và cộng sự, 2007). Bạn có thể nhập cùng tham số vào G∗Power để đối chiếu; kết quả có thể lệch 1–2 người do làm tròn."
    - "**Câu hỏi mô tả** dùng công thức ước lượng tỷ lệ của Cochran (1977). Trường THPT có số học sinh hữu hạn, nên nhập quy mô tổng thể (số học sinh của khối/trường) để cỡ mẫu được hiệu chỉnh nhỏ lại cho phù hợp."
    - "**Quy tắc “mỗi nhóm ít nhất 30 người”** chỉ là kinh nghiệm để trung bình mẫu gần phân phối chuẩn, không phải cách tính cỡ mẫu. Cỡ mẫu theo lực kiểm định là căn cứ chặt chẽ hơn."
    - "**Đây là số phiếu hợp lệ tối thiểu.** Nên thu dư 10–20% vì sẽ có phiếu bị loại; với so sánh nhóm, cỡ mẫu tính cho các nhóm bằng nhau, nhóm lệch nhau nhiều (ví dụ 80 nam, 20 nữ) thì cần nhiều người hơn."

  tai_lieu:
    cochran1954: "Cochran, W. G. (1954). Some methods for strengthening the common χ² tests. *Biometrics, 10*(4), 417–451. https://doi.org/10.2307/3001616"
    cochran1977: "Cochran, W. G. (1977). *Sampling techniques* (3rd ed.). John Wiley & Sons."
    cohen1988: "Cohen, J. (1988). *Statistical power analysis for the behavioral sciences* (2nd ed.). Lawrence Erlbaum Associates."
    cohen1992: "Cohen, J. (1992). A power primer. *Psychological Bulletin, 112*(1), 155–159. https://doi.org/10.1037/0033-2909.112.1.155"
    faul2007: "Faul, F., Erdfelder, E., Lang, A.-G., & Buchner, A. (2007). G∗Power 3: A flexible statistical power analysis program for the social, behavioral, and biomedical sciences. *Behavior Research Methods, 39*(2), 175–191. https://doi.org/10.3758/BF03193146"
    hulley2013: "Hulley, S. B., Cummings, S. R., Browner, W. S., Grady, D. G., & Newman, T. B. (2013). *Designing clinical research* (4th ed.). Lippincott Williams & Wilkins."
  ten_nguon:
    cochran1954: "Cochran (1954)"
    cochran1977: "Cochran (1977)"
    cohen1988: "Cohen (1988)"
    cohen1992: "Cohen (1992)"
    faul2007: "Faul và cộng sự (2007) – G∗Power"
    hulley2013: "Hulley và cộng sự (2013)"

nhan_dang:
  # Nhận dạng câu hỏi học sinh tự viết – theo từ khóa, không dùng AI
  tu_khoa:
    truoc_sau: ["trước và sau", "trước – sau", "trước-sau", "sau khi", "thay đổi", "cải thiện"]
    so_sanh: ["khác biệt", "khác nhau", "so sánh", "giữa nam và nữ", "giữa các", "theo giới tính", "theo khối", "cao hơn", "thấp hơn"]
    lien_he: ["liên quan", "liên hệ", "mối quan hệ", "tương quan", "càng", "gắn với"]
    mo_ta: ["thực trạng", "mức độ", "như thế nào", "bao nhiêu", "tỷ lệ", "phổ biến", "thường"]
  nhan_qua: ["ảnh hưởng", "tác động", "gây ra", "làm cho", "dẫn đến", "quyết định", "nguyên nhân"]
  canh_bao:
    nhan_qua: >-
      Câu hỏi có từ “{tu}”, tức là khẳng định quan hệ **nhân quả**. Khảo sát một lần chỉ cho biết hai yếu tố có
      **liên hệ** hoặc các nhóm có **khác biệt**, chưa đủ để kết luận cái này gây ra cái kia. Nên viết lại, ví dụ:
      “Có mối liên hệ giữa … và … không?”, hoặc giữ chữ “ảnh hưởng” trong tên đề tài nhưng thận trọng khi kết luận.
    hai_cau_hoi: >-
      Câu hỏi có thể đang gộp **hai câu hỏi** (có “và … không”, hoặc nhiều dấu hỏi). Mỗi câu hỏi nghiên cứu nên
      chỉ hỏi một điều để chọn đúng một phép phân tích.
    khong_ro: "Chưa nhận ra dạng câu hỏi. Hãy dùng các cụm như “như thế nào”, “có khác biệt … giữa … không”, “có liên hệ giữa … và … không”."
    qua_ngan: "Câu hỏi quá ngắn; hãy nêu rõ yếu tố cần đo và đối tượng (ví dụ: học sinh khối 10–12)."
    khong_hoi: "Câu hỏi nghiên cứu nên kết thúc bằng dấu “?” và có dạng một câu hỏi."
    co_the_co: "Câu hỏi dạng “có … không?” là câu hỏi kiểm định: bạn cần giả thuyết H0/H1 và một phép kiểm định."
