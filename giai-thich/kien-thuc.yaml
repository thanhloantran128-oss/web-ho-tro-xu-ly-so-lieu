# Nội dung tab "Kiến thức thống kê". Sửa lời văn trực tiếp; giữ nguyên các khóa (id, ten, la_gi…).
# Mỗi mục: la_gi (là gì) · vi_sao (vì sao cần) · cach_doc (cách đọc / công thức) · vi_du · luu_y.
# Định dạng: **đậm**, *nghiêng*. Số viết theo APA với dấu phẩy thập phân.

gioi_thieu: >-
  Trang này giải thích các chỉ số thống kê xuất hiện trong kết quả, và **vì sao** mỗi bước phân tích là cần thiết.
  Bạn có thể đọc theo thứ tự từ trên xuống (đúng trình tự một nghiên cứu), hoặc tìm nhanh một thuật ngữ.

bang_chon_phep:
  tieu_de: "Chọn phép phân tích nào?"
  ghi_chu: "Xác định **mục tiêu** và **loại biến** trước, rồi tra bảng. Cột cuối là phép thay thế khi dữ liệu không đạt điều kiện."
  cot: ["Bạn muốn…", "Loại biến", "Phép phân tích", "Khi không đạt điều kiện"]
  hang:
    - ["Mô tả một biến phân loại", "Định danh / thứ bậc", "Tần suất", "—"]
    - ["Mô tả một biến định lượng", "Khoảng / tỷ lệ, điểm thang đo", "Thống kê mô tả, Trung bình – độ lệch chuẩn", "Báo cáo trung vị nếu lệch mạnh"]
    - ["Mô tả câu chọn nhiều đáp án", "Nhiều lựa chọn", "Câu nhiều lựa chọn", "—"]
    - ["Kiểm tra thang đo trước khi tính điểm", "Các câu Likert của cùng một khái niệm", "Chấm điểm thang đo (Cronbach's α)", "Xem lại câu đảo chiều, loại câu"]
    - ["So sánh trung bình với một giá trị", "Định lượng", "One-sample t-test", "Wilcoxon một mẫu"]
    - ["So sánh trung bình 2 nhóm người khác nhau", "Định lượng × nhóm (2 nhóm)", "Independent t-test", "Mann-Whitney U"]
    - ["So sánh 2 lần đo trên cùng người", "Định lượng (2 lần đo)", "Paired t-test", "Wilcoxon"]
    - ["So sánh trung bình từ 3 nhóm", "Định lượng × nhóm (≥ 3 nhóm)", "One-way ANOVA", "Welch ANOVA, Kruskal-Wallis"]
    - ["Xem 2 biến phân loại có liên hệ không", "Phân loại × phân loại", "Bảng chéo – Chi-square", "Fisher's exact (bảng 2 × 2)"]
    - ["Xem 2 biến định lượng có cùng thay đổi không", "Định lượng × định lượng", "Tương quan Pearson", "Tương quan Spearman"]

