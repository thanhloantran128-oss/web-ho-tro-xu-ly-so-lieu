# Câu mẫu giải thích kết quả chấm điểm thang đo.
# Biến có sẵn: {ten_thang} {tac_gia} {ten_diem} {m} {sd} {n} {n_loai} {alpha} {cac_cau} {cac_muc}
#   {khoang_quan_sat} {khoang_thang} {goi_y_tru} {cot} {dong} {r} {nguon_nguong}

muc_dich: "Tính điểm {ten_thang} theo đúng quy tắc của tác giả (đảo câu, cộng tổng hoặc lấy trung bình, nhân hệ số nếu có)."
muc_dich_likert: "Mỗi biến được tính bằng trung bình các câu thuộc biến đó, sau khi đảo các câu phát biểu ngược."

trang_thai:
  can_xac_nhan: "Dữ liệu nằm trong khoảng {khoang_quan_sat} nhưng thang gốc là {khoang_thang}. Có thể phiếu đã mã hóa lệch 1 đơn vị. Nếu đúng vậy, hãy xác nhận để hệ thống trừ {goi_y_tru} cho mọi câu. Nếu sai bước này, toàn bộ điểm và phân loại sẽ sai."
  loi_du_lieu: "Chưa tính được điểm vì có giá trị không hợp lệ. Hãy sửa dữ liệu rồi chạy lại."
  loi_ngoai_khoang: "Cột **{cot}**: giá trị ngoài khoảng ở dòng {dong}."
  loi_khong_phai_so: "Cột **{cot}**: ô không phải số ở dòng {dong}."
  loi_khong_nguyen: "Cột **{cot}**: số lẻ (không nguyên) ở dòng {dong}."

diem: "**{ten_diem}**: *M* = {m}; *SD* = {sd} (*n* = {n})."
bi_loai: "{n_loai} người bị loại khỏi điểm {ten_diem} vì thiếu ít nhất một câu."

do_tin_cay:
  rat_tot: "Cronbach's α của {ten_diem} = {alpha}: rất tốt."
  tot: "Cronbach's α của {ten_diem} = {alpha}: tốt."
  chap_nhan: "Cronbach's α của {ten_diem} = {alpha}: chấp nhận được với nghiên cứu khám phá."
  chua_dat: "Cronbach's α của {ten_diem} = {alpha}: chưa đạt (< ,60). Hãy kiểm tra lại bản dịch, cách mã hóa và các câu đảo chiều trước khi dùng điểm này."
  hai_cau: "{ten_diem} chỉ có 2 câu nên không dùng Cronbach's α; tương quan giữa 2 câu *r* = {r}."
  tuong_quan_am: "Ở {ten_diem}, các câu {cac_cau} có tương quan âm với tổng: có thể đây là câu đảo chiều chưa được đảo, hoặc đã bị đảo nhầm."
  tuong_quan_thap: "Ở {ten_diem}, các câu {cac_cau} có tương quan biến–tổng hiệu chỉnh < ,30: câu đóng góp kém vào thang đo."
  loai_cau: >-
    Ở {ten_diem}, nếu loại câu {cac_cau} thì Cronbach's α tăng lên {alpha_moi} (hiện tại {alpha}) – xem bảng
    *α nếu loại câu*. Chỉ cân nhắc loại khi câu đó có tương quan biến–tổng < ,30 **và** có lý do về nội dung
    (dịch chưa sát, học sinh dễ hiểu nhầm). Thang chuẩn của tác giả thì không tự ý bỏ câu; nếu bỏ, phải nêu rõ trong báo cáo.

phan_bo: "Phân bố theo ngưỡng tham khảo: {cac_muc}."

loai_nguong:
  tac_gia: "Ngưỡng do tác giả thang đo đưa ra ({nguon_nguong})."
  quy_uoc: "Ngưỡng là quy ước thường dùng, không phải chuẩn chính thức ({nguon_nguong})."
  sang_loc_lam_sang: "Đây là ngưỡng **sàng lọc**, không phải chẩn đoán ({nguon_nguong})."
  khong_co: "Thang này không có ngưỡng phân loại: chỉ báo cáo trung bình và so sánh giữa các nhóm."

nhay_cam: "Đây là thang đo về sức khỏe tinh thần: chỉ trình bày kết quả theo nhóm, không gắn nhãn cho cá nhân (ví dụ viết “x% có điểm ở mức vừa trở lên”, không viết “x% bị trầm cảm”)."

bao_cao:
  phuong_phap: "{ten_diem} được đo bằng {ten_thang} ({tac_gia}). Độ tin cậy trong mẫu nghiên cứu: Cronbach's α = {alpha}."
  ket_qua: "{ten_diem} có trung bình {m} (*SD* = {sd})."

# Ghi chú tiêu chí độ tin cậy web đang dùng – hiện dưới bảng kết quả chấm điểm thang đo
ghi_chu_tieu_chi:
  - "**Cronbach's α** (chỉ tính khi thang có từ 3 câu): ≥ ,90 rất tốt; ,70 – < ,90 tốt; ,60 – < ,70 chấp nhận được với nghiên cứu khám phá; < ,60 chưa đạt (Nunnally & Bernstein, 1994; Hair và cộng sự, 2010). α > ,95 có thể do các câu gần như trùng ý (Streiner, 2003)."
  - "**Tương quan biến – tổng hiệu chỉnh** (Corrected Item-Total Correlation): tương quan của một câu với tổng các câu còn lại. Nên ≥ ,30 (Nunnally & Bernstein, 1994); giá trị âm thường do câu đảo chiều chưa được đảo."
  - "**α nếu loại câu** (Cronbach's Alpha if Item Deleted): α của thang khi bỏ riêng câu đó. Nếu lớn hơn α hiện tại, câu đó đang kéo độ tin cậy xuống; chỉ cân nhắc loại khi đồng thời có tương quan biến – tổng < ,30 và có lý do về nội dung."
  - "**Thang 2 câu**: không dùng α, web báo hệ số tương quan *r* giữa hai câu (Eisinga và cộng sự, 2013)."
  - "Cách tính giống SPSS (Analyze → Scale → Reliability Analysis): sau khi đảo câu đảo chiều, chỉ dùng người trả lời đủ mọi câu của thang (listwise). Trung bình và phương sai “nếu loại câu” tính trên **tổng** các câu còn lại."

goi_mo:
  - "Độ tin cậy trong mẫu của bạn có tương đương với nghiên cứu gốc không?"
  - "Bạn sẽ dùng điểm thang đo này để so sánh giữa những nhóm nào?"
