ma: SCS-SF
ten_goc: Self-Compassion Scale – Short Form
ten_viet: Thang đo lòng tự trắc ẩn – bản rút gọn 12 câu
tac_gia: "Raes, Pommier, Neff & Van Gucht (2011). Clinical Psychology & Psychotherapy 18:250–255"
khai_niem: cách đối xử với bản thân trong lúc khó khăn
so_cau: 12
gia_tri: {min: 1, max: 5}
nhan_gia_tri: {1: Hầu như không bao giờ, 5: Hầu như luôn luôn}
cau_dao_nguoc: [1, 4, 8, 9, 11, 12]   # các câu của 3 tiểu thang tiêu cực; 6 − x
tieu_thang:
  - {ma: SK, ten: Tử tế với bản thân,          cau: [2, 6],   cach_tinh: trung_binh}
  - {ma: SJ, ten: Phán xét bản thân (đã đảo),  cau: [11, 12], cach_tinh: trung_binh}
  - {ma: CH, ten: Tính nhân loại chung,        cau: [5, 10],  cach_tinh: trung_binh}
  - {ma: IS, ten: Cô lập (đã đảo),             cau: [4, 8],   cach_tinh: trung_binh}
  - {ma: MI, ten: Chánh niệm,                  cau: [3, 7],   cach_tinh: trung_binh}
  - {ma: OI, ten: Đồng nhất quá mức (đã đảo),  cau: [1, 9],   cach_tinh: trung_binh}
diem_tong:
  cach_tinh: trung_binh_cac_tieu_thang   # trung bình của 6 điểm tiểu thang (sau khi đảo)
  he_so: 1
  khoang: [1, 5]
  chieu: cao_hon_la_tu_trac_an_hon
phan_loai:
  - {tu: 1.00, den: 2.49, muc: Thấp}
  - {tu: 2.50, den: 3.50, muc: Trung bình}
