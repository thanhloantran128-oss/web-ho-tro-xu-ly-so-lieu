nguon_phan_loai: "Neff – tài liệu SCS-SF information: 'ad hoc rubric', không có chuẩn lâm sàng"
loai_nguong: tac_gia
xu_ly_thieu: "Mặc định hệ thống: thiếu câu nào thì không tính điểm tổng"
nhay_cam: false
canh_bao:
  - "Tác giả KHÔNG khuyến nghị dùng điểm tiểu thang của bản rút gọn (mỗi tiểu thang chỉ 2 câu, độ tin cậy thấp). Chỉ báo cáo điểm tổng"
  - "Bài báo gốc 2011 cộng tổng điểm; hướng dẫn hiện hành của Neff dùng trung bình (thang 1–5). Ghi rõ cách tính trong báo cáo"
  - "Ngưỡng thấp/trung bình/cao chỉ là quy ước tạm; nhiều nghiên cứu dùng chia đôi theo trung vị của mẫu"
quyen_su_dung: "Neff cho phép dùng bản rút gọn cho mọi mục đích (nghiên cứu, giảng dạy, lâm sàng), cần trích dẫn Raes et al. (2011)"
ban_tieng_viet: "Có thể lấy 12 câu tương ứng từ bản dịch SCS-26 (bảng đối chiếu trong tài liệu của Neff). Danh sách bản dịch xem trên self-compassion.org"
doi_chieu_scs26: {1: 6, 2: 26, 3: 14, 4: 13, 5: 15, 6: 12, 7: 9, 8: 25, 9: 2, 10: 10, 11: 1, 12: 11}
nguon_xac_minh:
