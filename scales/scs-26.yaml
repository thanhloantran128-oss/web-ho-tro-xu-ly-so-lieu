  - "Có thể báo cáo 6 điểm tiểu thang (khác với bản rút gọn). Neff et al. (2019) ủng hộ dùng cả điểm tổng lẫn 6 điểm tiểu thang"
  - "Học sinh 10–14 tuổi: Neff có bản dành cho thiếu niên (SCS-Youth); hỏi giáo viên hướng dẫn trước khi dùng"
